
name: Deploy Frontend to Hostinger

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vest-website-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build static frontend
      - name: Build static frontend
        run: |
          npm run build
          cp .htaccess out/.htaccess

      # 5. Verify frontend build
      - name: Verify frontend build
        id: verify
        run: |
          if [ ! -d "out" ]; then
            echo "ERROR: out folder was not created"
            exit 1
          fi

          if [ ! -f "out/index.html" ]; then
            echo "ERROR: out/index.html was not created"
            exit 1
          fi

          if [ ! -f "out/.htaccess" ]; then
            echo "ERROR: out/.htaccess was not created"
            exit 1
          fi

          echo "Frontend build verified successfully"

          echo "Total build size:"
          du -sh out

          echo "Total number of files:"
          find out -type f | wc -l

          echo "Largest folders:"
          du -h --max-depth=2 out | sort -hr | head -20

          echo "Contents of out:"
          ls -la out

      # 6. Deploy to vestinnovations.com
      - name: Deploy to vestinnovations.com
        id: deploy_com
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_COM_SERVER }}
          username: ${{ secrets.FTP_COM_USERNAME }}
          password: ${{ secrets.FTP_COM_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ${{ secrets.FTP_COM_DIRECTORY }}
          local-dir: ./out/
          dangerous-clean-slate: false
          timeout: 600000
          log-level: verbose

      # 7. Deploy to vestinnovations.in
      - name: Deploy to vestinnovations.in
        id: deploy_in
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_IN_SERVER }}
          username: ${{ secrets.FTP_IN_USERNAME }}
          password: ${{ secrets.FTP_IN_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: ${{ secrets.FTP_IN_DIRECTORY }}
          local-dir: ./out/
          dangerous-clean-slate: false
          timeout: 600000
          log-level: verbose

      # 8. Deploy to vestsolution.com
      - name: Deploy to vestsolution.com
        id: deploy_old
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /public_html/
          local-dir: ./out/
          dangerous-clean-slate: false
          timeout: 600000
          log-level: verbose

      # 9. Deployment summary
      - name: Deployment summary
        if: ${{ always() }}
        run: |
          echo "## Website Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Website | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| vestinnovations.com | ${{ steps.deploy_com.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| vestinnovations.in | ${{ steps.deploy_in.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| vestsolution.com | ${{ steps.deploy_old.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
