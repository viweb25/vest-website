name: Deploy Frontend to Hostinger

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build static frontend
      - name: Build static frontend
        run: |
          npm run build
          cp .htaccess out/.htaccess

  
      - name: Verify frontend build
        run: |
          if [ ! -d "out" ]; then
            echo "ERROR: out folder was not created"
            exit 1
          fi

          if [ ! -f "out/index.html" ]; then
            echo "ERROR: out/index.html was not created"
            exit 1
          fi

          if [ ! -f "out/.htaccess" ]; then
            echo "ERROR: out/.htaccess was not created"
            exit 1
          fi

          echo "Frontend build verified successfully"
          echo "Contents of out:"
          ls -la out

      # 6. Deploy static frontend to Hostinger
      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./out/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**